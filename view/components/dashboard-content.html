<!-- Dashboard Content Component -->
<div id="dashboard-content">
    <!-- Statistics Cards -->
    <div class="row mb-4">
        <div class="col-xl-3 col-md-6 mb-3">
            <div class="card stats-card border-start border-primary border-4">
                <div class="card-body d-flex align-items-center">
                    <div class="stats-icon bg-primary bg-opacity-10 text-primary me-3">
                        <i class="bi bi-ticket-detailed"></i>
                    </div>
                    <div>
                        <div class="text-primary fw-bold">Total Tickets</div>
                        <div class="h4 mb-0" id="totalTickets">
                            <div class="spinner-border spinner-border-sm text-muted"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-xl-3 col-md-6 mb-3">
            <div class="card stats-card border-start border-warning border-4">
                <div class="card-body d-flex align-items-center">
                    <div class="stats-icon bg-warning bg-opacity-10 text-warning me-3">
                        <i class="bi bi-clock-history"></i>
                    </div>
                    <div>
                        <div class="text-warning fw-bold">Pending Review</div>
                        <div class="h4 mb-0" id="pendingTickets">
                            <div class="spinner-border spinner-border-sm text-muted"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-xl-3 col-md-6 mb-3">
            <div class="card stats-card border-start border-success border-4">
                <div class="card-body d-flex align-items-center">
                    <div class="stats-icon bg-success bg-opacity-10 text-success me-3">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <div>
                        <div class="text-success fw-bold">Completed</div>
                        <div class="h4 mb-0" id="completedTickets">
                            <div class="spinner-border spinner-border-sm text-muted"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-xl-3 col-md-6 mb-3">
            <div class="card stats-card border-start border-info border-4">
                <div class="card-body d-flex align-items-center">
                    <div class="stats-icon bg-info bg-opacity-10 text-info me-3">
                        <i class="bi bi-calendar-week"></i>
                    </div>
                    <div>
                        <div class="text-info fw-bold">This Week</div>
                        <div class="h4 mb-0" id="weeklyTickets">
                            <div class="spinner-border spinner-border-sm text-muted"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="row mb-4">
        <div class="col-md-8 mb-3">
            <div class="card h-100">
                <div class="card-header bg-light">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-lightning-fill me-2"></i>
                        Quick Actions
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-6 col-md-3">
                            <button class="btn btn-outline-primary w-100" onclick="reviewPendingTickets()">
                                <i class="bi bi-eye d-block mb-1"></i>
                                Review Tickets
                            </button>
                        </div>
                        <div class="col-6 col-md-3">
                            <button class="btn btn-outline-success w-100" onclick="generateReports()">
                                <i class="bi bi-file-earmark-bar-graph d-block mb-1"></i>
                                Generate Report
                            </button>
                        </div>
                        <div class="col-6 col-md-3">
                            <button class="btn btn-outline-info w-100" onclick="manageTemplates()">
                                <i class="bi bi-file-earmark-text d-block mb-1"></i>
                                Templates
                            </button>
                        </div>
                        <div class="col-6 col-md-3">
                            <button class="btn btn-outline-secondary w-100" onclick="systemSettings()">
                                <i class="bi bi-gear d-block mb-1"></i>
                                Settings
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-header bg-light">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-graph-up me-2"></i>
                        Today's Activity
                    </h6>
                </div>
                <div class="card-body" data-today-activity>
                    <!-- Content will be loaded dynamically -->
                    <div class="text-center text-muted">
                        <div class="spinner-border spinner-border-sm" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Activity -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h6 class="card-title mb-0">
                        <i class="bi bi-clock-history me-2"></i>
                        Recent Activity
                    </h6>
                    <button class="btn btn-sm btn-outline-primary" onclick="viewAllActivity()">
                        View All
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush" id="recentActivityList">
                        <!-- Loading state -->
                        <div class="list-group-item text-center py-4">
                            <div class="spinner-border spinner-border-sm text-muted" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="mt-2 text-muted">Loading recent activity...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
